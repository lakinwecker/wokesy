name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      - name: Check nixpkgs and rust-overlay pins match
        run: ci/nixpkgs-pin.sh

      - name: Check formatting
        run: devenv shell -- cargo fmt --check

      - name: Lint
        run: devenv shell -- cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: devenv shell -- cargo nextest run

      - name: Run doc tests
        run: devenv shell -- cargo test --doc

      - name: Test Kubernetes manifests
        run: devenv shell -- test-manifests

      - name: Validate Kubernetes manifests
        run: devenv shell -- bash -c 'render-manifests | kubeconform -strict -summary -'

  nix:
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
